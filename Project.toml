# WS numeric-frame work has a live before/after number. Dev-sourced from the sibling checkout.
[sources]
SlateExtensionsBase = {path = "../KaimonSlate-widgets/lib/SlateExtensionsBase"}

[compat]
SlateExtensionsBase = "0.1"
julia = "1.10"
